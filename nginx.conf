# Bots que generan la vista previa al pegar un link en un chat (WhatsApp,
# Telegram, Facebook, Twitter/X, Slack, Discord, LinkedIn, iMessage vía
# Apple, Skype) — a esos, y solo a esos, se les sirve el HTML con Open Graph
# dinámico que arma el backend (logo/nombre reales de la iglesia y la
# conferencia). Cualquier navegador real sigue cayendo en la SPA de siempre:
# esos bots no ejecutan JavaScript, así que la SPA (que resuelve todo del
# lado del cliente) nunca les habría mostrado nada más que el index.html
# genérico y estático de la landing.
map $http_user_agent $is_link_preview_bot {
    default 0;
    ~*facebookexternalhit 1;
    ~*Facebot 1;
    ~*Twitterbot 1;
    ~*WhatsApp 1;
    ~*TelegramBot 1;
    ~*Slackbot 1;
    ~*LinkedInBot 1;
    ~*Discordbot 1;
    ~*SkypeUriPreview 1;
    ~*iMessageBot 1;
    ~*Pinterest 1;
    ~*redditbot 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Comprimir lo que se sirve. Las fuentes y el JS del bundle son la mayor
    # parte del peso de la primera carga.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Los assets salen de Vite con un hash en el nombre, así que su contenido
    # nunca cambia: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NO se cachea: es quien apunta a los assets con hash nuevo tras
    # cada despliegue. Si se cachea, el navegador sigue pidiendo el bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Mismo /programa/:token que ve cualquier persona — pero si quien pide la
    # página es uno de los bots de vista previa, se le sirve el HTML con Open
    # Graph dinámico del backend en vez de la SPA. api.micongrega.cloud es la
    # URL fija de producción (nginx.conf no tiene acceso a VITE_API_URL: ese
    # valor solo existe embebido en el JS del build, no en tiempo de
    # ejecución) — si el dominio de la API cambia algún día, hay que
    # actualizarlo también acá.
    location ~ "^/programa/([0-9a-f]{32})$" {
        if ($is_link_preview_bot) {
            proxy_pass https://api.micongrega.cloud/api/public/conference/$1/og;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # Fallback de SPA: el enrutado lo hace React Router en el navegador, así que
    # cualquier ruta desconocida (/dashboard/members, /login…) debe devolver
    # index.html. Sin esto, recargar en una ruta interna da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Para el healthcheck del contenedor, sin ensuciar los logs de acceso.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
